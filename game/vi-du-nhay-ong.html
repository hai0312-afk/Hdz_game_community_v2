<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    height: 100%;
    position: fixed;
    width: 100%;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a1a2e, #16213e);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    display: flex;
  }
  canvas {
    display: block;
    background: #70c5ce;
    touch-action: none;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    width: auto;
    height: auto;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center;
    background: rgba(0,0,0,0.35);
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
  }
  #overlay h1 { font-size: 40px; margin-bottom: 10px; }
  #overlay p { font-size: 18px; margin-top: 8px; opacity: 0.9; }
  #overlay .hint { font-size: 14px; margin-top: 20px; opacity: 0.8; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
  #score {
    position: absolute; top: 15px; left: 0; right: 0;
    text-align: center; color: white; font-size: 48px; font-weight: bold;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    pointer-events: none;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="score">0</div>
  <div id="overlay">
    <h1>🐤 Flappy Bird</h1>
    <p>Nhấn <b>Space</b> / Click / Chạm để bay</p>
    <p class="hint">Nhấn để bắt đầu</p>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');

// ---------- Game state ----------
let state = 'ready'; // ready, playing, over
let frame = 0;
let score = 0;
let best = Number(localStorage.getItem('flappyBest') || 0);

// ---------- Bird ----------
const bird = {
  x: 90, y: H/2, w: 34, h: 26,
  vy: 0, gravity: 0.45, flapPower: -8, rotation: 0
};

// ---------- Pipes ----------
const pipeW = 62;
const gap = 165;
const pipeSpeed = 2.6;
let pipes = [];
let pipeTimer = 0;

// ---------- Clouds / background ----------
let clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random()*W, y: 40 + Math.random()*150, s: 0.5+Math.random()*0.8, speed: 0.3+Math.random()*0.4 });
}

// ---------- Ground ----------
const groundH = 90;
let groundX = 0;

function resetGame() {
  bird.y = H/2; bird.vy = 0; bird.rotation = 0;
  pipes = []; pipeTimer = 0; score = 0; frame = 0;
  scoreEl.textContent = '0';
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    overlay.style.display = 'none';
    bird.vy = bird.flapPower;
  } else if (state === 'playing') {
    bird.vy = bird.flapPower;
  } else if (state === 'over') {
    resetGame();
    state = 'ready';
    overlay.style.display = 'flex';
    overlay.innerHTML = '<h1>🐤 Flappy Bird</h1><p>Nhấn <b>Space</b> / Click / Chạm để bay</p><p class="hint">Nhấn để bắt đầu</p>';
  }
}

const gameContainer = document.getElementById('gameContainer');

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});

// Gắn lên cả container (không chỉ canvas) vì overlay nằm đè lên trên canvas
// và sẽ chặn mất sự kiện click/touch nếu chỉ lắng nghe trên canvas.
gameContainer.addEventListener('mousedown', e => { e.preventDefault(); flap(); });
gameContainer.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});

// Chặn pinch-zoom bằng gesture (Safari) và double-tap zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, {passive:false});

function spawnPipe() {
  const minTop = 60;
  const maxTop = H - groundH - gap - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W, top: topH, bottom: topH + gap, scored: false });
}

function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function update() {
  frame++;

  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -80) c.x = W + 80;
  });

  if (state === 'playing') {
    bird.vy += bird.gravity;
    bird.y += bird.vy;
    bird.rotation = Math.max(-0.5, Math.min(1.3, bird.vy / 10));

    pipeTimer++;
    if (pipeTimer > 95) { pipeTimer = 0; spawnPipe(); }

    pipes.forEach(p => p.x -= pipeSpeed);
    pipes = pipes.filter(p => p.x > -pipeW);

    pipes.forEach(p => {
      if (!p.scored && p.x + pipeW < bird.x) {
        p.scored = true;
        score++;
        scoreEl.textContent = score;
      }
      const bx = bird.x - bird.w/2, by = bird.y - bird.h/2;
      if (rectsOverlap(bx,by,bird.w,bird.h, p.x,0,pipeW,p.top) ||
          rectsOverlap(bx,by,bird.w,bird.h, p.x,p.bottom,pipeW,H-p.bottom)) {
        gameOver();
      }
    });

    if (bird.y + bird.h/2 > H - groundH || bird.y - bird.h/2 < 0) {
      bird.y = Math.max(bird.h/2, Math.min(H - groundH - bird.h/2, bird.y));
      gameOver();
    }

    groundX -= pipeSpeed;
    if (groundX <= -24) groundX = 0;
  }
}

function gameOver() {
  if (state !== 'playing') return;
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('flappyBest', best); }
  overlay.style.display = 'flex';
  overlay.innerHTML = `<h1>💥 Game Over</h1><p>Điểm: ${score}</p><p>Kỷ lục: ${best}</p><p class="hint">Nhấn để chơi lại</p>`;
}

// ---------- Drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#4ec0ca');
  g.addColorStop(0.75, '#8fdde4');
  g.addColorStop(1, '#bff0e8');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // sun
  ctx.beginPath();
  ctx.arc(W-60, 70, 28, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,247,200,0.9)';
  ctx.fill();

  // clouds
  clouds.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.arc(22,5,16,0,Math.PI*2);
    ctx.arc(-20,6,15,0,Math.PI*2);
    ctx.arc(5,-12,15,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // distant hills
  ctx.fillStyle = 'rgba(60,150,90,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, H-groundH);
  for (let x = 0; x <= W; x += 40) {
    ctx.lineTo(x, H-groundH - 30 - Math.sin(x*0.02)*20);
  }
  ctx.lineTo(W, H-groundH);
  ctx.closePath();
  ctx.fill();
}

function drawPipe(p) {
  const capH = 26;
  function segment(y, h) {
    const grad = ctx.createLinearGradient(p.x, 0, p.x+pipeW, 0);
    grad.addColorStop(0, '#4fae3d');
    grad.addColorStop(0.15, '#6ec957');
    grad.addColorStop(0.5, '#5cbe48');
    grad.addColorStop(1, '#3f8f30');
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, y, pipeW, h);
    ctx.strokeStyle = '#2f6e24';
    ctx.lineWidth = 3;
    ctx.strokeRect(p.x+1.5, y, pipeW-3, h);
  }
  // top pipe
  segment(0, p.top - capH);
  ctx.fillStyle = '#5cbe48';
  ctx.fillRect(p.x-4, p.top-capH, pipeW+8, capH);
  ctx.strokeStyle = '#2f6e24';
  ctx.strokeRect(p.x-4, p.top-capH, pipeW+8, capH);
  // bottom pipe
  segment(p.bottom + capH, H - groundH - (p.bottom+capH));
  ctx.fillStyle = '#5cbe48';
  ctx.fillRect(p.x-4, p.bottom, pipeW+8, capH);
  ctx.strokeStyle = '#2f6e24';
  ctx.strokeRect(p.x-4, p.bottom, pipeW+8, capH);
}

function drawGround() {
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H-groundH, W, groundH);
  ctx.fillStyle = '#c2b769';
  for (let x = groundX; x < W; x += 24) {
    ctx.fillRect(x, H-groundH, 12, 10);
  }
  ctx.fillStyle = '#8fae3d';
  ctx.fillRect(0, H-groundH, W, 8);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  const flap = state === 'playing' ? Math.sin(frame*0.5) : Math.sin(frame*0.2);

  // body
  const grad = ctx.createRadialGradient(-5,-5,2,0,0,20);
  grad.addColorStop(0, '#ffe98a');
  grad.addColorStop(1, '#ffc93c');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0,0, 17, 13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#e0a01c';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // wing
  ctx.save();
  ctx.translate(-2, 2);
  ctx.rotate(flap*0.5);
  ctx.fillStyle = '#ffdd57';
  ctx.beginPath();
  ctx.ellipse(0,0,10,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#e0a01c';
  ctx.stroke();
  ctx.restore();

  // tail
  ctx.fillStyle = '#ffc93c';
  ctx.beginPath();
  ctx.moveTo(-15,-3);
  ctx.lineTo(-24,-8);
  ctx.lineTo(-24,2);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(8,-5,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(10,-5,2.4,0,Math.PI*2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(14,-1);
  ctx.lineTo(24,2);
  ctx.lineTo(14,6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c76600';
  ctx.stroke();

  ctx.restore();
}

function draw() {
  drawBackground();
  pipes.forEach(drawPipe);
  drawGround();
  drawBird();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
