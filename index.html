<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="HDZ Game Community - Game từ cộng đồng có đam mê">
<title>HDZ Game Community</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">

  <div class="topbar">

    <div class="logo-row">
      <div class="logo-cart"></div>
      <h1 class="site-title pixel">HDZ <span>GAME</span> COMMUNITY</h1>
    </div>

    <div class="account-area" id="account-area">
      <button class="account-button ghost-button" id="login-btn" type="button">
        Đăng nhập
      </button>

      <button class="account-button primary-button" id="register-btn" type="button">
        Tạo tài khoản
      </button>
    </div>

    <div class="user-area" id="user-area" hidden>
      <button class="account-button ghost-button" id="profile-btn" type="button">
        👤 <span id="user-name">Người dùng</span>
      </button>

      <button class="account-button ghost-button" id="logout-btn" type="button">
        Đăng xuất
      </button>
    </div>

  </div>

  <p class="tagline">
    Game từ cộng đồng có đam mê - Cảm ơn sự đóng góp của @028riuklhoang
  </p>

  <div class="search-wrap">

    <div class="search-slot">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>

      <input
        id="search"
        type="text"
        placeholder="Tìm tên game hoặc creator..."
        autocomplete="off"
      >

    </div>

    <p class="search-hint">
      Gõ tên game hoặc tên người đăng.
    </p>

  </div>

</header>

<main>

  <div class="creator-actions">

    <div class="tabs">

      <button class="tab active" id="home-tab" type="button">
        🎮 Tất cả game
      </button>

      <button class="tab" id="following-btn" type="button">
        👥 Đang follow
      </button>

      <button class="tab" id="my-games-btn" type="button">
        🕹 Game của tôi
      </button>

    </div>

    <button class="upload-button" id="upload-game-btn" type="button">
      ＋ Đăng game
    </button>

  </div>

  <div class="section-row">

    <div>
      <h2 id="section-title">
        Thư viện game — mới nhất trước
      </h2>

      <p id="section-subtitle" class="section-subtitle">
        Game từ cộng đồng HDZ
      </p>
    </div>

    <span class="count-pill" id="count-pill">
      0 game
    </span>

  </div>

  <div class="grid" id="grid">

    <div class="empty-state">
      Đang tải game...
    </div>

  </div>

</main>

<footer>
  <strong>HDZ Game Community</strong>
  · Game từ cộng đồng có đam mê
</footer>

<div id="modal-root"></div>

<div id="toast-root"></div>

<script type="module" src="script.js"></script>

</body>
</html>
